[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioauth-linux"
version = "0.2.0"
description = "Experimental local face verification for Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-contrib-python>=4.8"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]

[project.scripts]
bioauth = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]
